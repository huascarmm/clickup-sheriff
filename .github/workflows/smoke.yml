name: Smoke (en vivo)

# Verificacion manual contra el servicio desplegado. Por defecto solo corre el
# dry-run (no escribe en MySQL ni postea a Slack). Para incluir el test que
# escribe de verdad, ejecutalo con allow_writes = true (postea a Slack).
on:
  workflow_dispatch:
    inputs:
      allow_writes:
        description: 'Incluir el test que escribe en MySQL y postea a Slack'
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Las credenciales MySQL solo se necesitan (y solo se leen de Secret
      # Manager/GitHub) si allow_writes = true: el dry-run no toca la base.
      - name: Smoke test
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEBHOOK_SECRET: ${{ secrets.SMOKE_WEBHOOK_SECRET }}
          SMOKE_TASK_ID: ${{ vars.SMOKE_TASK_ID }}
          SMOKE_ALLOW_WRITES: ${{ inputs.allow_writes && '1' || '' }}
          MYSQL_HOST: ${{ inputs.allow_writes && vars.MYSQL_HOST || '' }}
          MYSQL_PORT: ${{ inputs.allow_writes && vars.MYSQL_PORT || '' }}
          MYSQL_USER: ${{ inputs.allow_writes && vars.MYSQL_USER || '' }}
          MYSQL_DATABASE: ${{ inputs.allow_writes && vars.MYSQL_DATABASE || '' }}
          MYSQL_PASSWORD: ${{ inputs.allow_writes && secrets.MYSQL_PASSWORD || '' }}
          MYSQL_SSL: ${{ inputs.allow_writes && 'true' || '' }}
          MYSQL_SSL_CA: ${{ inputs.allow_writes && secrets.MYSQL_SSL_CA || '' }}
        run: npm run test:smoke
